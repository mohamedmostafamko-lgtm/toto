name: food_delivery
description: Local food delivery app with live courier tracking.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1
  firebase_messaging: ^15.1.3
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^17.2.4
  firebase_storage: ^12.3.2
  cloud_functions: ^5.1.3
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

flutter:
  uses-material-design: true
